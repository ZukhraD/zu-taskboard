<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>Задачи</title>
<style>
:root{
  --cream:#f7f2e8; --beige:#ece6d6; --card:#ffffff; --ink:#141414; --muted:#7a7568; --line:#e4ddcb;
  --pink:#f6b5d3; --blue:#b7c3f3; --yellow:#f6d96b; --green:#a9b96a;
  --pink-d:#e0559a; --yellow-d:#d9a400; --danger:#d6336c;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);
  font:15px/1.4 Manrope,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100%;max-width:1200px;margin:0 auto;gap:14px;padding:12px}

/* --- боковая панель --- */
aside{width:250px;flex-shrink:0;background:var(--ink);color:#ece8dc;border-radius:26px;
  padding:calc(20px + var(--safe-t)*0) 12px 16px;overflow-y:auto}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;color:#fff;padding:4px 12px 8px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--pink);display:inline-block}
.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8b877b;margin:18px 12px 6px}
.nav-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border:0;background:none;
  border-radius:12px;text-align:left;cursor:pointer;color:#d9d5c8;font-weight:500}
.nav-item .cnt{font-size:12px;color:#8b877b}
.nav-item.active{background:rgba(255,255,255,.1);color:var(--pink);font-weight:700}
.nav-item.active .cnt{color:var(--pink)}
.row-add{display:flex;gap:6px;margin:8px 4px 0}
.row-add input{flex:1;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid #333;background:#222;color:#fff}
.row-add input::placeholder{color:#8b877b}
.side-btns{display:flex;gap:6px;margin:0 4px;flex-wrap:wrap}

/* --- кнопки --- */
.btn{border:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:700}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.soft{background:rgba(255,255,255,.1);color:#ece8dc}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid #f0c4d3}

/* --- основная часть --- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:calc(10px + var(--safe-t)) 6px 10px;display:flex;align-items:flex-end;gap:10px}
.h-text{flex:1;min-width:0}
header h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.025em;font-weight:800}
#sub{color:var(--muted);font-size:14px;margin-top:4px}
#menuBtn{display:none;border:0;background:var(--ink);color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
#list{flex:1;overflow-y:auto;padding:4px 2px 120px}

/* --- панель-дашборд --- */
.dash{display:grid;grid-template-columns:170px 1fr;gap:12px;margin-bottom:18px;max-width:720px}
.ring{position:relative;display:flex;align-items:center;justify-content:center}
.ring svg{width:100%;height:auto;max-width:170px}
.ring .mid{position:absolute;text-align:center}
.ring .num{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:flex;flex-direction:column;gap:8px}
.stat{border:0;text-align:left;border-radius:20px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:default;color:var(--ink)}
.stat.click{cursor:pointer}
.stat .s-l{font-size:13px;font-weight:600;opacity:.8}
.stat .s-n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat.pink{background:var(--pink)} .stat.blue{background:var(--blue)} .stat.yellow{background:var(--yellow)}

/* --- задачи --- */
.group-title{font-size:13px;font-weight:700;color:var(--muted);margin:14px 6px 8px}
.task{background:var(--card);border-radius:20px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--line)}
.t-row{display:flex;align-items:flex-start;gap:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #b9b3a2;background:none;flex-shrink:0;cursor:pointer;margin-top:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;padding:0}
.chk.done{background:var(--green);border-color:var(--green)}
.chk.p1{border-color:var(--pink-d)} .chk.p2{border-color:var(--yellow-d)}
.chk.done.p1,.chk.done.p2{border-color:var(--green)}
.t-body{flex:1;min-width:0;cursor:pointer}
.t-title{word-break:break-word;font-weight:600;font-size:16px}
.done-t{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.pill{padding:2px 10px;border-radius:99px;font-weight:700;color:var(--ink);background:var(--beige)}
.pill.date{background:var(--yellow)} .pill.late{background:var(--pink)} .pill.proj{background:var(--blue)}
.note-t{align-self:center}
.subs{margin:8px 0 0 38px}
.sub{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.sub .chk{width:18px;height:18px;font-size:11px;margin:0;border-width:2px}
.sub-add{margin:6px 0 0 38px}
.sub-add input{width:100%;padding:7px 12px;border-radius:12px;border:0;background:var(--beige);font-size:14px}
.sub-add input::placeholder{color:var(--muted)}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
.empty{text-align:center;color:var(--muted);margin-top:40px;font-weight:500}
.fab{position:fixed;right:22px;bottom:calc(22px + var(--safe-b));width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);
  color:var(--pink);font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}

/* --- окно задачи --- */
dialog{border:0;border-radius:26px;padding:20px;width:min(460px,92vw);background:var(--cream);color:var(--ink)}
dialog::backdrop{background:rgba(20,20,20,.45)}
dialog h2{margin:0 0 14px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{padding:10px 12px;border-radius:14px;border:0;background:var(--beige);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{box-shadow:0 0 0 2px var(--blue)}
.f-row{display:flex;gap:10px}.f-row .f{flex:1;min-width:0}
.actions{display:flex;justify-content:space-between;margin-top:8px}
.scrim{display:none}

@media (max-width:760px){
  #app{padding:0;gap:0}
  main{padding:0 14px}
  aside{position:fixed;z-index:20;left:10px;top:10px;bottom:10px;border-radius:26px;transform:translateX(-110%);transition:transform .2s;width:280px}
  aside.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,20,.4);z-index:10}
  #menuBtn{display:block}
  header h1{font-size:26px}
  .dash{grid-template-columns:128px 1fr}
  .ring .num{font-size:30px}
  .stat{padding:9px 12px;border-radius:16px}
  .stat .s-n{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><i></i>Задачи</div>
    <div id="smart"></div>
    <div class="nav-title">Проекты</div>
    <div id="projects"></div>
    <div class="row-add">
      <input id="newProject" placeholder="Новый проект" enterkeyhint="done">
      <button class="btn pink" id="addProject">+</button>
    </div>
    <div class="nav-title">Данные</div>
    <div class="side-btns">
      <button class="btn soft" id="exportBtn">Экспорт</button>
      <button class="btn soft" id="importBtn">Импорт</button>
    </div>
    <input type="file" id="importFile" accept="application/json" hidden>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <header>
      <button id="menuBtn" aria-label="Меню">☰</button>
      <div class="h-text">
        <h1 id="title">Сегодня</h1>
        <div id="sub"></div>
      </div>
      <button class="btn danger" id="delProject" hidden>Удалить</button>
    </header>
    <div id="list"></div>
  </main>
</div>
<button class="fab" id="fab" aria-label="Добавить задачу">+</button>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Новая задача</h2>
    <div class="f"><label>Название</label><input id="fTitle" required autocomplete="off"></div>
    <div class="f"><label>Заметка</label><textarea id="fNote" rows="2"></textarea></div>
    <div class="f-row">
      <div class="f"><label>Срок</label><input type="date" id="fDate"></div>
      <div class="f"><label>Время</label><input type="time" id="fTime"></div>
    </div>
    <div class="f-row">
      <div class="f"><label>Проект</label><select id="fProject"></select></div>
      <div class="f"><label>Приоритет</label>
        <select id="fPrio"><option value="3">Обычный</option><option value="2">Средний</option><option value="1">Высокий</option></select>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="fDelete">Удалить</button>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn ghost" id="fCancel">Отмена</button>
        <button class="btn" id="fSave" value="ok">Сохранить</button>
      </div>
    </div>
  </form>
</dialog>

<script>
(function(){
const KEY='taskapp.v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const $=id=>document.getElementById(id);
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>dstr(new Date());

let state=load();
let view={type:'today'}; // today | upcoming | inbox | all | done | project
let editingId=null;

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks)return s}catch(e){}
  return {projects:[],tasks:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Не удалось сохранить данные')}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(t){
  if(!t.date)return '';
  const td=todayStr();
  const d=new Date(t.date+'T00:00');
  const tm=new Date();tm.setDate(tm.getDate()+1);
  let s=t.date===td?'Сегодня':t.date===dstr(tm)?'Завтра':d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  if(t.time)s+=', '+t.time;
  return s;
}

function filtered(){
  const td=todayStr();
  let l=state.tasks.slice();
  switch(view.type){
    case 'today': l=l.filter(t=>!t.done&&t.date&&t.date<=td);break;
    case 'upcoming': l=l.filter(t=>!t.done&&t.date&&t.date>td);break;
    case 'inbox': l=l.filter(t=>!t.done&&!t.projectId);break;
    case 'all': l=l.filter(t=>!t.done);break;
    case 'done': l=l.filter(t=>t.done);break;
    case 'project': l=l.filter(t=>t.projectId===view.id&&!t.done);break;
  }
  l.sort((a,b)=>{
    const da=a.date?a.date+(a.time||'99:99'):'9999';
    const db=b.date?b.date+(b.time||'99:99'):'9999';
    return da<db?-1:da>db?1:(a.prio-b.prio);
  });
  return l;
}

function stats(){
  const td=todayStr();
  const open=state.tasks.filter(t=>!t.done);
  const doneToday=state.tasks.filter(t=>t.done&&t.doneAt&&dstr(new Date(t.doneAt))===td).length;
  const overdue=open.filter(t=>t.date&&t.date<td).length;
  const todayOpen=open.filter(t=>t.date&&t.date<=td).length;
  const upcoming=open.filter(t=>t.date&&t.date>td).length;
  return {open,doneToday,overdue,todayOpen,upcoming};
}

function dashHtml(){
  const s=stats();
  const total=s.doneToday+s.todayOpen;
  const frac=total?s.doneToday/total:0;
  const R=54,C=2*Math.PI*R;
  const arc=frac>0?`<circle cx="70" cy="70" r="${R}" fill="none" stroke="#f6b5d3" stroke-width="18" stroke-linecap="round"
      stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 70 70)"/>`:'';
  return `<div class="dash">
    <div class="ring">
      <svg viewBox="0 0 140 140" aria-hidden="true">
        <circle cx="70" cy="70" r="${R}" fill="none" stroke="#f6d96b" stroke-width="18"/>
        ${arc}
      </svg>
      <div class="mid"><div class="num">${s.todayOpen}</div><div class="lbl">осталось</div></div>
    </div>
    <div class="stats">
      <button class="stat pink click" data-go="today"><span class="s-l">Просрочено</span><span class="s-n">${s.overdue}</span></button>
      <button class="stat blue click" data-go="upcoming"><span class="s-l">Впереди</span><span class="s-n">${s.upcoming}</span></button>
      <button class="stat yellow click" data-go="done"><span class="s-l">Сделано сегодня</span><span class="s-n">${s.doneToday}</span></button>
    </div>
  </div>`;
}

function render(){
  const td=todayStr();
  const open=state.tasks.filter(t=>!t.done);
  const counts={
    today:open.filter(t=>t.date&&t.date<=td).length,
    upcoming:open.filter(t=>t.date&&t.date>td).length,
    inbox:open.filter(t=>!t.projectId).length,
    all:open.length,
    done:state.tasks.length-open.length
  };
  const smart=[['today','Сегодня'],['upcoming','Предстоящие'],['inbox','Входящие'],['all','Все'],['done','Выполнено']];
  $('smart').innerHTML=smart.map(([k,n])=>navBtn(k,n,counts[k],view.type===k)).join('');
  $('projects').innerHTML=state.projects.map(p=>{
    const c=open.filter(t=>t.projectId===p.id).length;
    return navBtn('p:'+p.id,esc(p.name),c,view.type==='project'&&view.id===p.id);
  }).join('');
  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    view=k.startsWith('p:')?{type:'project',id:k.slice(2)}:{type:k};
    closeMenu();render();
  });

  let title=smart.find(s=>s[0]===view.type)?.[1];
  if(view.type==='project')title=state.projects.find(p=>p.id===view.id)?.name||'Проект';
  $('title').textContent=title;
  const ds=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('sub').textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
  $('delProject').hidden=view.type!=='project';

  const items=filtered();
  const dash=view.type==='today'?dashHtml():'';
  if(!items.length){
    $('list').innerHTML=dash+'<div class="empty">Здесь пока пусто.<br>Нажмите «+», чтобы добавить задачу.</div>';
  }else{
    $('list').innerHTML=dash+(view.type==='today'?'<div class="group-title">Задачи на сегодня</div>':'')+items.map(taskHtml).join('');
  }
  bindList();
}
function navBtn(k,name,c,active){
  return `<button class="nav-item${active?' active':''}" data-k="${k}"><span>${name}</span><span class="cnt">${c||''}</span></button>`;
}
function taskHtml(t){
  const td=todayStr();
  const late=!t.done&&t.date&&t.date<td;
  const proj=t.projectId?state.projects.find(p=>p.id===t.projectId):null;
  const subs=(t.subs||[]).map(s=>`<div class="sub"><button class="chk${s.done?' done':''}" data-sub="${s.id}" data-t="${t.id}">${s.done?'✓':''}</button>
    <span class="${s.done?'done-t':''}" style="flex:1">${esc(s.title)}</span>
    <button class="icon-btn" data-subdel="${s.id}" data-t="${t.id}" aria-label="Удалить подзадачу">×</button></div>`).join('');
  const sd=(t.subs||[]).filter(s=>s.done).length;
  return `<div class="task" data-id="${t.id}">
    <div class="t-row">
      <button class="chk p${t.prio}${t.done?' done':''}" data-chk="${t.id}" aria-label="Выполнить">${t.done?'✓':''}</button>
      <div class="t-body" data-edit="${t.id}">
        <div class="t-title${t.done?' done-t':''}">${esc(t.title)}</div>
        <div class="meta">
          ${t.date?`<span class="pill ${late?'late':'date'}">${fmtDate(t)}</span>`:''}
          ${proj?`<span class="pill proj">${esc(proj.name)}</span>`:''}
          ${(t.subs||[]).length?`<span class="pill">${sd}/${t.subs.length}</span>`:''}
          ${t.note?`<span class="note-t">${esc(t.note.slice(0,60))}</span>`:''}
        </div>
      </div>
    </div>
    ${subs?`<div class="subs">${subs}</div>`:''}
    ${t.done?'':`<div class="sub-add"><input data-subadd="${t.id}" placeholder="+ Подзадача" enterkeyhint="done"></div>`}
  </div>`;
}
function bindList(){
  const L=$('list');
  L.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view={type:b.dataset.go};render()});
  L.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{
    const t=state.tasks.find(x=>x.id===b.dataset.chk);
    t.done=!t.done;t.doneAt=t.done?Date.now():null;
    save();render();
  });
  L.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openDialog(b.dataset.edit));
  L.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const t=state.tasks.find(x=>x.id===b.dataset.t);
    const s=t.subs.find(x=>x.id===b.dataset.sub);s.done=!s.done;save();render();
  });
  L.querySelectorAll('[data-subdel]').forEach(b=>b.onclick=()=>{
    const t=state.tasks.find(x=>x.id===b.dataset.t);
    t.subs=t.subs.filter(x=>x.id!==b.dataset.subdel);save();render();
  });
  L.querySelectorAll('[data-subadd]').forEach(inp=>inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const v=inp.value.trim();if(!v)return;
    const t=state.tasks.find(x=>x.id===inp.dataset.subadd);
    (t.subs=t.subs||[]).push({id:uid(),title:v,done:false});
    save();render();
    const again=L.querySelector(`[data-subadd="${t.id}"]`);if(again)again.focus();
  }));
}

// --- диалог ---
function fillProjects(sel){
  $('fProject').innerHTML='<option value="">Без проекта</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('fProject').value=sel||'';
}
function openDialog(id){
  editingId=id||null;
  const t=id?state.tasks.find(x=>x.id===id):null;
  $('dlgTitle').textContent=t?'Задача':'Новая задача';
  $('fTitle').value=t?t.title:'';
  $('fNote').value=t?(t.note||''):'';
  $('fDate').value=t?(t.date||''):(view.type==='today'?todayStr():'');
  $('fTime').value=t?(t.time||''):'';
  $('fPrio').value=t?String(t.prio):'3';
  fillProjects(t?t.projectId:(view.type==='project'?view.id:''));
  $('fDelete').style.display=t?'':'none';
  $('dlg').showModal();
  if(!t)setTimeout(()=>$('fTitle').focus(),50);
}
$('fab').onclick=()=>openDialog();
$('fCancel').onclick=()=>$('dlg').close();
$('fDelete').onclick=()=>{
  if(!confirm('Удалить задачу?'))return;
  state.tasks=state.tasks.filter(t=>t.id!==editingId);
  save();$('dlg').close();render();
};
$('form').addEventListener('submit',()=>{
  const title=$('fTitle').value.trim();
  if(!title)return;
  const data={title,note:$('fNote').value.trim(),date:$('fDate').value,time:$('fTime').value,
    prio:+$('fPrio').value,projectId:$('fProject').value||null};
  if(editingId){Object.assign(state.tasks.find(t=>t.id===editingId),data)}
  else state.tasks.push({id:uid(),done:false,subs:[],created:Date.now(),...data});
  save();render();
});

// --- проекты ---
function addProject(){
  const v=$('newProject').value.trim();if(!v)return;
  const p={id:uid(),name:v};state.projects.push(p);
  $('newProject').value='';save();view={type:'project',id:p.id};closeMenu();render();
}
$('addProject').onclick=addProject;
$('newProject').addEventListener('keydown',e=>{if(e.key==='Enter')addProject()});
$('delProject').onclick=()=>{
  if(!confirm('Удалить проект? Его задачи останутся во «Входящих».'))return;
  state.tasks.forEach(t=>{if(t.projectId===view.id)t.projectId=null});
  state.projects=state.projects.filter(p=>p.id!==view.id);
  save();view={type:'inbox'};render();
};

// --- меню на телефоне ---
function closeMenu(){$('side').classList.remove('open');$('scrim').classList.remove('show')}
$('menuBtn').onclick=()=>{$('side').classList.add('open');$('scrim').classList.add('show')};
$('scrim').onclick=closeMenu;

// --- экспорт / импорт ---
$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tasks-'+todayStr()+'.json';a.click();
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s.tasks||!s.projects)throw 0;
      if(confirm('Заменить текущие данные импортированными?')){state=s;save();render()}
    }catch(_){alert('Файл не подходит')}
  };
  r.readAsText(f);e.target.value='';
};

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
render();
})();
</script>
</body>
</html>
