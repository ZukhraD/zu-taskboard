<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>Задачи</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><i></i>Задачи</div>
    <div id="nav"></div>
    <div class="nav-title">Проекты</div>
    <div id="projects"></div>
    <div class="row-add">
      <input id="newProject" placeholder="Новый проект" enterkeyhint="done" autocomplete="off">
      <button class="btn pink" id="addProject" aria-label="Добавить проект">+</button>
    </div>
    <div id="nav2"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <header>
      <div class="h-text">
        <h1 id="title">Сегодня</h1>
        <div id="sub"></div>
      </div>
      <div class="h-actions">
        <button class="btn sm soft" id="renProject" hidden>Переименовать</button>
        <button class="btn sm danger" id="delProject" hidden>Удалить</button>
        <button class="iconbtn" id="searchBtn" aria-label="Поиск"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      </div>
    </header>
    <div class="quickwrap" id="quickwrap">
      <form class="quick" id="quick" autocomplete="off">
        <input id="qInput" placeholder="Новая задача… (завтра в 15:00 #проект !1)" enterkeyhint="send" autocomplete="off" aria-label="Быстрое добавление задачи">
        <button type="button" class="qai" id="qAi" title="Разобрать с помощью ИИ: можно вставить целое сообщение с несколькими задачами">ИИ</button>
        <button class="qbtn" aria-label="Добавить"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
      <div class="qprev" id="qPrev" aria-live="polite"></div>
    </div>
    <div id="list"></div>
  </main>
</div>
<button class="fab" id="fab" aria-label="Добавить задачу">+</button>

<nav id="tabs" aria-label="Разделы">
  <button data-tab="today"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg><span>Сегодня</span></button>
  <button data-tab="calendar"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Календарь</span></button>
  <button data-tab="habits"><svg class="ico" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg><span>Привычки</span></button>
  <button data-tab="stats"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span>Итоги</span></button>
  <button data-tab="more"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Ещё</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span><button type="button" id="toastUndo">Отменить</button>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Новая задача</h2>
    <div class="f"><label for="fTitle">Название</label><input id="fTitle" required autocomplete="off"></div>
    <div class="f"><label for="fNote">Заметка</label><textarea id="fNote" rows="2"></textarea></div>
    <div class="f-row">
      <div class="f"><label for="fDate">Срок</label><input type="date" id="fDate"></div>
      <div class="f"><label for="fTime">Время</label><input type="time" id="fTime"></div>
    </div>
    <div class="chips">
      <button type="button" data-q="0">Сегодня</button><button type="button" data-q="1">Завтра</button>
      <button type="button" data-q="7">Через неделю</button><button type="button" data-q="x">Без срока</button>
    </div>
    <div class="f"><label for="fRepeat">Повтор</label>
      <select id="fRepeat"><option value="">Не повторять</option><option value="daily">Каждый день</option>
      <option value="weekdays">По будням</option><option value="weekly">Каждую неделю</option><option value="monthly">Каждый месяц</option></select>
    </div>
    <div class="f-row">
      <div class="f"><label for="fProject">Проект</label><select id="fProject"></select></div>
      <div class="f"><label for="fPrio">Приоритет</label>
        <select id="fPrio"><option value="3">Обычный</option><option value="2">Средний</option><option value="1">Высокий</option></select>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="fDelete">Удалить</button>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn ghost" id="fCancel">Отмена</button>
        <button class="btn" id="fSave" value="ok">Сохранить</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="hdlg">
  <form method="dialog" id="hform">
    <h2 id="hTitleH">Новая привычка</h2>
    <div class="f"><label for="hName">Название</label><input id="hName" required autocomplete="off" placeholder="Например: зарядка"></div>
    <div class="f"><label>Дни недели</label>
      <div class="chips" id="hDays">
        <button type="button" data-d="0">Пн</button><button type="button" data-d="1">Вт</button><button type="button" data-d="2">Ср</button>
        <button type="button" data-d="3">Чт</button><button type="button" data-d="4">Пт</button><button type="button" data-d="5">Сб</button><button type="button" data-d="6">Вс</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="hDelete">Удалить</button>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn ghost" id="hCancel">Отмена</button>
        <button class="btn">Сохранить</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="sdlg" class="sdlg">
  <input class="sinput" id="sInput" placeholder="Поиск по задачам, проектам, привычкам" autocomplete="off" aria-label="Поиск">
  <div class="sres" id="sRes"></div>
  <div class="actions" style="justify-content:flex-end"><button type="button" class="btn ghost" id="sClose">Закрыть</button></div>
</dialog>

<input type="file" id="importFile" accept="application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
